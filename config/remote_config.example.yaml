# Configuração do 4ham Remote Operation
# Copiar este ficheiro para remote_config.yaml e ajustar os valores

server:
  host: "0.0.0.0"
  port: 8000
  # Para HTTPS (necessário para WebRTC):
  # ssl_certfile: "certs/cert.pem"
  # ssl_keyfile: "certs/key.pem"

auth:
  users:
    - username: "ct7bfv"
      # Gerar com: python scripts/hash_password.py <password>
      password_hash: "$2b$12$SUBSTITUIR_PELO_HASH_REAL"
      role: "operator"   # operator | rx_only
    - username: "guest"
      password_hash: "$2b$12$SUBSTITUIR_PELO_HASH_REAL"
      role: "rx_only"

rig:
  # Perfil activo: ft991a | x6100 | custom
  profile: "ft991a"

  # Porta série do rádio.
  # "auto" (padrão): detecta automaticamente via /dev/serial/by-id/
  #   procura pelo adaptador CP2105 (FT-991A), interface 0 (porta CAT).
  # Path explícito: usar o symlink estável by-id (recomendado) ou /dev/ttyUSBx.
  #   Exemplo (FT-991A):
  #     serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2105_Dual_USB_to_UART_Bridge_Controller_00C307D3-if00-port0"
  serial_port: "auto"

  # Modelo Hamlib do rádio (1035 = FT-991A). Só relevante quando o backend
  # arranca o rigctld (serial_port configurado ou detectado).
  hamlib_model: 1035
  baud: 38400

  rigctld:
    host: "127.0.0.1"
    port: 4532

audio:
  # Nome do dispositivo sounddevice (deixar null para usar o padrão)
  # Ver dispositivos disponíveis: python -c "import sounddevice; print(sounddevice.query_devices())"
  device: null
  sample_rate: 48000
  channels: 2      # 2 para FT-991A (L=RX, R=TX); 1 para dispositivos mono
  rx_channel: 0    # Índice do canal RX (0 = esquerdo)
  tx_channel: 1    # Índice do canal TX (1 = direito)

ptt:
  # Limite máximo de transmissão em segundos
  max_tx_seconds: 180
  # Bandas HF permitidas para TX (Hz)
  allowed_bands:
    - [1800000, 2000000]     # 160m
    - [3500000, 3800000]     # 80m
    - [7000000, 7200000]     # 40m
    - [10100000, 10150000]   # 30m
    - [14000000, 14350000]   # 20m
    - [18068000, 18168000]   # 17m
    - [21000000, 21450000]   # 15m
    - [24890000, 24990000]   # 12m
    - [28000000, 29700000]   # 10m

spectrum:
  # Fonte do espectro para a waterfall/panadapter:
  #   audio_fft  — FFT do áudio AF do rádio (0-3 kHz, comportamento base)
  #   rtlsdr     — Espectro RF wideband via dongle RTL-SDR (±50 kHz centrado no VFO)
  source: "audio_fft"
  rtlsdr:
    device_index: 0       # Índice do dongle RTL-SDR (0 para o primeiro)
    sample_rate: 250000   # Hz — mínimo 225001; 250000 dá ±125 kHz de span
    ppm_correction: 0     # Correcção de frequência em PPM
    gain: 30.0            # Ganho em dB (0 = auto)
    span_hz: 100000       # Span visível (Hz); centrado no VFO — apenas informativo

decoders:
  ft8:
    enabled: true
    # Caminho para o executável jt9 (instalado com wsjtx)
    jt9_path: "/usr/bin/jt9"
  cw:
    enabled: true
  aprs:
    enabled: false
    # Direwolf deve estar a correr separadamente
    direwolf_host: "127.0.0.1"
    direwolf_kiss_port: 8001
